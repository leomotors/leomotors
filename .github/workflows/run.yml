name: Update All Data

on:
  schedule:
    # * Runs at 4AM Everyday
    - cron: 0 21 * * *

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - .github/workflows/run.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  stats:
    name: All
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/github-stats/requirements.txt

      - name: Install requirements
        run: python3 -m pip install -r apps/github-stats/requirements.txt

      - name: Generate images
        working-directory: apps/github-stats
        run: |
          python3 generate_images.py
          mkdir -p ../../generated
          mv generated/* ../../generated
        env:
          ACCESS_TOKEN: ${{ secrets.GH_PAT }}
          EXCLUDE_FORKED_REPOS: true
          EXCLUDED_LANGS: Jupyter Notebook

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup node with cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Turborepo Magic
        run: pnpm post-analyze
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated README.md
          git diff --cached --quiet || {
            git commit -m "Update Generated Data and Readme"
            git push
          }
